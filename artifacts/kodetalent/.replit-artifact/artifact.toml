kind = "web"
previewPath = "/"
title = "KodeTalent"
version = "1.0.0"
id = "artifacts/kodetalent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26079

[services.development]
run = "pnpm --filter @workspace/kodetalent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kodetalent", "run", "build" ]
publicDir = "artifacts/kodetalent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26079"
BASE_PATH = "/"
