<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>KodeTalent — AI Career Companion for Engineering Students</title>
    <meta name="description" content="KodeTalent is India's AI career companion for engineering students. Get AI mock interviews, skill roadmaps, resume builder, recruiter connections, and placement prep — all in one app." />
    <meta name="keywords" content="kodetalent, AI career companion, engineering students, placement prep, mock interview, resume builder, internships, jobs, campus placement, India" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kodetalent.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KodeTalent" />
    <meta property="og:title" content="KodeTalent — AI Career Companion for Engineering Students" />
    <meta property="og:description" content="India's AI career companion for engineering students. Mock interviews, skill roadmaps, AI resume builder, and recruiter connections — placement-ready in 60 seconds." />
    <meta property="og:url" content="https://kodetalent.com/" />
    <meta property="og:image" content="https://kodetalent.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KodeTalent — AI Career Companion for Engineering Students" />
    <meta name="twitter:description" content="India's AI career companion for engineering students. Mock interviews, skill roadmaps, AI resume builder, recruiter connections." />
    <meta name="twitter:image" content="https://kodetalent.com/opengraph.jpg" />

    <!-- Favicon + theme -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F97316" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- JSON-LD: WebSite + SiteLinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KodeTalent",
      "alternateName": "KodeTalent AI Career Companion",
      "url": "https://kodetalent.com",
      "description": "India's AI Career Companion for engineering students — mock interviews, skill roadmaps, resume builder, and recruiter connections.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kodetalent.com/opportunities?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "KodeTalent",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "India's AI Career Companion for engineering students. GitHub-verified profiles, AI mock interviews, skill roadmaps, resume builder, and direct recruiter connections.",
      "url": "https://kodetalent.com",
      "screenshot": "https://kodetalent.com/opengraph.jpg",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "featureList": [
        "AI Mock Interviews",
        "Skill Roadmaps",
        "AI Resume Builder",
        "Recruiter Marketplace",
        "Placement Drive Verifier",
        "Leaderboard"
      ]
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KodeTalent",
      "url": "https://kodetalent.com",
      "logo": "https://kodetalent.com/favicon.svg",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
